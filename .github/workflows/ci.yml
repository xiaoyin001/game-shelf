# 文件说明：本地与Actions使用同一有界工具容器；源码和联机分别取证，不自动写回仓库。
name: ci
on:
  push:
    branches: ["master", "feat/**", "fix/**", "build/**", "ci/**", "docs/**", "test/**", "chore/**"]
  pull_request:
    branches: ["master"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: 准备共用源码工具
        timeout-minutes: 10
        run: npm run verify:ci -- --job source --prepare
      - name: 完整源码与并发回归
        timeout-minutes: 12
        run: npm run verify:ci -- --job source --run
      - name: 保存源码证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: .local/logs/ci-verify-*/
          include-hidden-files: true
          retention-days: 7
  playable:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: 准备共用浏览器工具
        timeout-minutes: 10
        run: npm run verify:ci -- --job playable --prepare
      - name: 当前真实依赖与两轮完整回归
        timeout-minutes: 12
        run: npm run verify:ci -- --job playable --run
      - name: 保存联机证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-evidence
          path: .local/logs/ci-verify-*/
          include-hidden-files: true
          retention-days: 7
